*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f14;font-family:-apple-system,"SF Pro Text",Inter,Arial,sans-serif;color:#f4ede0;margin:0}
:root{--np-surface:#16181e;--np-card:rgba(255,255,255,.05);--np-card-press:rgba(255,255,255,.09);--np-line:rgba(255,255,255,.08);--np-text:#f4ede0;--np-sub:#9a9488;--np-dim:#5f5b54;--np-gold:#ffd98a;--np-gold-bg:rgba(255,217,138,.15);--np-red:#ff7a80;--np-red-bg:rgba(230,57,70,.18);--np-green:#6fd39a;--np-green-bg:rgba(111,211,154,.15);--np-blue:#9fb8ff;--np-blue-bg:rgba(120,160,255,.15);--np-steel:#8fb0c8;--np-steel-bg:rgba(143,176,200,.15);--np-grey:#b5afa3;--np-grey-bg:rgba(255,255,255,.08);--app-bg:radial-gradient(120vmax 90vh at 80% -10%,#3a1418 0,#12151b 45%,#0d0f14 100%)}
.s{min-height:100vh;position:relative;isolation:isolate}

.sm{font-size:12px;color:#9a9488}

.chips{display:flex;gap:6px;overflow:hidden;margin-bottom:10px}.chip{font-size:12px;padding:6px 11px;border-radius:20px;background:#1c1f26;color:#b5afa3;white-space:nowrap;font-weight:600}.chip.on{background:#ffd98a;color:#1a1408}
.sync{font-size:11px;color:#6fd39a;display:flex;align-items:center;gap:5px}.sync:before{content:"";width:7px;height:7px;border-radius:50%;background:#6fd39a;box-shadow:0 0 6px #6fd39a}
.demo{position:absolute;top:52px;right:18px;font-size:9px;letter-spacing:1px;color:#ff7a80;border:1px solid #ff7a8066;padding:2px 6px;border-radius:6px;font-weight:700}
.tab{position:fixed;padding-bottom:env(safe-area-inset-bottom)}.tab div{cursor:pointer}.demo{display:none}
.tab{position:fixed;left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));height:62px;padding:0 6px;display:flex;justify-content:space-around;align-items:center;
 border-radius:31px;background:rgba(30,32,38,.55);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
 border:.5px solid rgba(255,255,255,.14);box-shadow:inset 0 .5px 0 rgba(255,255,255,.18),0 8px 30px rgba(0,0,0,.45);top:auto}

.c{padding-bottom:calc(100px + env(safe-area-inset-bottom))}

.stp{display:flex;gap:6px;align-items:center}.stp button,.ib{all:unset;background:#23262e;color:#f4ede0;border-radius:9px;padding:6px 11px;font-weight:700;cursor:pointer}

#sheet .pn{background:#16181e;width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.rem{font-variant-numeric:tabular-nums}
.sf{font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--np-blue);background:var(--np-blue-bg);padding:1px 6px;border-radius:20px;margin-left:5px;white-space:nowrap}
.sec{font-size:12px;font-weight:600;color:var(--np-sub);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 6px}
.strip{display:grid;gap:8px;margin-bottom:10px}.strip .card{margin:0;padding:10px}.ss .v{font-size:16px;font-weight:800;margin:3px 0 4px}.ss .sm{font-size:11px;line-height:1.45}
.cgrid{display:block}
/* iPad / large screens (>=700px): centered column, floating tab bar and sheets. Phone layout (<700px) is untouched. */
@media (min-width:700px){

h1{font-size:34px}.big{font-size:30px}
.tab{left:50%;right:auto;width:min(600px,calc(100% - 32px));transform:translateX(-50%)}
.strip .card{padding:14px}.ss .v{font-size:20px}.ss .sm{font-size:12px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#sheet .bd{align-items:center;justify-content:center}#sheet .pn{max-width:600px;border-radius:22px;max-height:84vh}
body .npS{left:50%;right:auto;width:640px;margin-left:-320px;border-radius:14px 14px 0 0}
body .tp-bd{align-items:center;justify-content:center}body .tp-pn{max-width:600px;border-radius:22px;max-height:84vh;border:1px solid var(--np-line)}
input,select,textarea{font-size:16px}
}
@media (min-width:1100px){.c{max-width:960px}}
.seg{display:flex;gap:2px;padding:2px;margin:8px 0 6px;background:rgba(255,255,255,.07);border-radius:10px}.seg-b{all:unset;box-sizing:border-box;flex:1;min-width:0;text-align:center;padding:6px 4px;border-radius:8px;font:600 13px -apple-system,system-ui;color:var(--np-sub);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}.seg-b span{color:var(--np-dim);font-weight:500;margin-left:2px}.seg-b.on{background:rgba(255,255,255,.16);color:var(--np-text)}.seg-b.on span{color:var(--np-sub)}
.srch{position:relative;margin:2px 0 10px}.srch svg{position:absolute;left:12px;top:50%;width:17px;height:17px;margin-top:-8.5px;fill:none;stroke:rgba(235,235,245,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.srch input{display:block;box-sizing:border-box;width:100%;margin:0;padding:10px 38px 10px 36px;font-size:16px;line-height:1.2;border-radius:12px;background:rgba(255,255,255,.08);border:0;color:#f4ede0;-webkit-appearance:none;appearance:none}
.srch input::placeholder{color:rgba(235,235,245,.4)}.srch input:focus{outline:none;background:rgba(255,255,255,.12)}
.srch button{all:unset;position:absolute;right:6px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;text-align:center;line-height:26px;font-size:20px;color:rgba(235,235,245,.6);cursor:pointer}.srch input:placeholder-shown+button{display:none}
.cnum{font-size:15px;font-weight:600;color:rgba(235,235,245,.5);vertical-align:3px;margin-left:4px}
.live{color:#6fd39a;font-weight:600;display:inline-flex;align-items:center;gap:5px}.live i{width:7px;height:7px;border-radius:50%;background:#6fd39a;position:relative;display:inline-block}.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:#6fd39a;animation:livepulse 1.6s ease-out infinite}@keyframes livepulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
/* ==== Inventory grouped list (inventory worker) ==== */
.ivg{background:var(--np-card);border:1px solid var(--np-line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ivgh{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-weight:600;cursor:pointer}.ivar{display:inline-block;width:12px;color:var(--np-sub)}
.ivr{padding:10px 14px;border-top:1px solid var(--np-line);cursor:pointer}.ivr.on{background:rgba(255,255,255,.04)}.ivr.ivx{cursor:default}
.ivh{display:flex;justify-content:space-between;align-items:center;gap:8px}.ivt{display:flex;align-items:center;gap:7px;min-width:0}
.ivn{text-align:right;white-space:nowrap}.ivn b{font-size:15px;font-weight:600;display:block}.ivn .sm{font-size:12px}
.ivs{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:9px}.ivs .stp button{padding:6px 10px}
.ivc{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.ivchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 9px;border-radius:9px;background:rgba(255,255,255,.07);color:var(--np-sub)}.ivchip b{color:var(--np-text);font-weight:600}
.ivchip.lo{background:var(--np-red-bg)}.ivchip.lo b{color:var(--np-red)}.ivchip.on{outline:1px solid rgba(255,255,255,.35)}
.ivlow{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--np-red);margin-right:5px;flex:none}
.ivd{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.ivd-ww{background:#f6dca6}.ivd-pw{background:#e9f1ff}.ivd-r{background:#d9534f}.ivd-g{background:#4caf6e}.ivd-b{background:#4f86e0}
.ivd-m{background:conic-gradient(#d9534f 0 25%,#4caf6e 0 50%,#4f86e0 0 75%,#f2c14e 0)}.ivd-cc{background:repeating-linear-gradient(45deg,#d9534f 0 2px,#f4f4f4 2px 4px)}
/* ==== end Inventory ==== */
.wrn{min-width:28px;height:28px;border-radius:14px;background:var(--np-gold-bg);color:var(--np-gold);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}.wrc{display:inline-block;padding:2px 7px;border-radius:7px;background:var(--np-gold-bg);color:var(--np-gold);font-size:12px;font-weight:600;margin:3px 4px 0 0}.wrc.q,.wrl.q{background:var(--np-grey-bg);color:var(--np-dim)}.wrl{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600}.wrl.q{padding:2px 7px;border-radius:7px;font-size:12px}.wrb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px}.wrb .lbl{width:40px}.wrp{font-size:12px;padding:2px 7px;border-radius:7px;background:var(--np-grey-bg);color:var(--np-sub)}.wrp b{color:var(--np-text)}.wrp.z{color:var(--np-dim)}.wrp.z b{color:var(--np-dim)}
@keyframes np-spin{to{transform:rotate(360deg)}}.np-spin{display:inline-block;animation:np-spin .8s linear infinite}

html,body{touch-action:manipulation}@supports(-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}

html,body{height:100%;width:100%;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none}
.s{height:100%;display:flex;flex-direction:column;overflow:hidden}
.c{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.hd{position:relative;padding-right:92px}
.hd h1{margin-right:0}

.npgear:active{opacity:.5}.npgear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.exb{position:absolute;top:6px;right:36px}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}.tap:active{opacity:.7}

#cnav.on aside{transform:none}.cnh{color:var(--np-sub);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:0 6px 10px}
#cnav aside button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 12px;border:0;border-radius:12px;background:var(--np-card);color:var(--np-text);font:inherit;font-size:17px;margin-bottom:8px}

.cns{color:var(--np-sub);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 6px 8px}
.npnm{color:var(--np-sub);font-size:13px;line-height:1.45;margin:0 6px 10px}
.cback{background:none;border:0;color:var(--np-gold);font:inherit;font-size:16px;padding:0;margin:4px 0 8px;cursor:pointer}
#sheet .bd{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end}
#sheet .bd.in{background:rgba(0,0,0,.55)}
#sheet .pn{background:#16181e;width:100%;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sheet .grab{width:36px;height:4px;background:#333;border-radius:2px;margin:4px auto 12px}

@media (min-width:700px){
  #sheet .bd{align-items:center;justify-content:center}
  #sheet .pn{max-width:600px;border-radius:22px;max-height:84vh}
}
